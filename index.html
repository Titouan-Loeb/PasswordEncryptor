<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=0"/>
  <title>Password encryptor</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/style.css" />
  <link rel="stylesheet" href="styles/noZoomPhone.css" />
  <link rel="stylesheet" href="styles/logo.css" />
  <link rel="icon" type="image/png" href="assets/icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Password Encryptor" />
  <script src="scripts/environmen-checks.js"></script>
</head>
<body>
  <div>
    <a href="pages/instructions.html" id="help" class="roundButton">
      <img src="assets/help.svg" height="16" width="16"/>
    </a>
  </div>
  <div class="container">
    <div class="logo">
      <img src="assets/hugeLogo.svg" alt="" width="128" height="128">
      <div class="title">Password encryptor</div>
    </div>
    <div class="numberOfParams">
      <div class="numberOfParams-title">Number of parameters:</div>
      <div class="numberOfParams-buttons-box">
        <button id="decreaseParam" class="littleRoundButton">-</button>
        <button id="increaseParam" class="littleRoundButton">+</button>
      </div>
    </div>
    <div class="parameters" id="parameters">
      <input type="text" id="param1" placeholder="Parameter n°1" />
      <input type="text" id="param2" placeholder="Parameter n°2" />
    </div>
    <input type="password" id="secret" placeholder="Secret key" />
    <div class="subtitle">Number of characters:</div>
    <div class="sliderContainer">
      <input type="range" min="10" max="32" value="16" id="slider"/>
      <div class="tooltip" id="follower">
        <div class="tooltip-arrow"></div>
        <div class="tooltip-box">
          <div class="tooltip-value" id="password-length">16</div>
        </div>
      </div>
    </div>
    <button class="textButton" id="copyBtn">Generate password</button>
  </div>

  <div id="toast" class="toast">Copied to clipboard!</div>
  <script src="scripts/script.js"></script>
</body>
</html>
